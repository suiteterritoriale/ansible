# Per-release upgrade requirements: which units `st-cli upgrade` must
# rebootstrap (`st-cli bootstrap <app> <env>`), and which newly declared
# components it should offer to bootstrap.
#
# `baseline` is the oldest supported bootstrap stamp. A unit stamped below it
# is flagged wholesale ("no longer supported — rebootstrap"), and one replay
# clears everything, so entries at or below the baseline carry no information.
#
# Prune rule: delete an entry ONLY when you raise `baseline` to or above its
# version. Never delete an entry above the baseline — a repo that has not
# caught up yet would silently skip the step. CI enforces this invariant.
#
# Only add an entry when operators MUST act. Adding an env var to a template or
# a var to apps/<app>.yml needs no entry — a rebootstrap picks those up anyway.
#
# Schema (see core/upgrades.py):
#   baseline: "0.0.0"                   # stamps below this are unsupported
#   flags:
#     - version: "0.3.0"                # the release that introduced the need;
#                                         # write "next" on a feature branch.
#                                         # `make version` replaces it
#       apps: [meet, drive]             # a list of app names, or the string: all
#       components: [meet]               # optional: component keys of `apps`
#                                         # (requires an explicit `apps` list);
#                                         # without it every unit of the app
#                                         # is flagged
#       reason: "meet 1.5 adds mandatory recording env vars"
#       link: "https://example.org/pr/12"  # optional: overrides the CHANGELOG
#                                         # anchor derived from `version`
#       full_replay: true                # optional, default false: forces a
#                                         # full pre-filled replay instead of
#                                         # a silent one
#       new_components: [livekit]        # optional: component keys newly
#                                         # declared for `apps` (must be an
#                                         # explicit list, not "all"); each
#                                         # key must be a real dependencies[].on
#                                         # target (e.g. "livekit", "pymta");
#                                         # upgrade offers to bootstrap them once
#       warnings: ["..."]                # optional: the manual steps the
#                                         # replay cannot do; a list of strings
baseline: "0.0.0"
flags:
  - version: "0.4.0"
    apps: [drive]
    components: [drive]
    reason: "drive moved the media proxy from nginx to a caddy container fed by st_drive_caddy_env"
    warnings:
      - "Remove st_drive_s3_protocol, st_drive_s3_host and st_drive_s3_bucket from drive/<env>/drive/vars.yml."
      - "Remove any st_drive_nginx_template override. In a custom st_drive_compose_template, add the drive-caddy service on st_drive_port and put the frontend on port 8080 behind it."
  - version: "0.5.1"
    apps: [messages]
    components: [socks-proxy]
    reason: "0.5.0 changed the inventory group st-cli writes from socks-proxy to socks_proxy. The replay rewrites the hosts file."
    warnings:
      - "Replace socks-proxy<n> with socks_proxy<n> in every -H/--host argument, script and runbook."
      - "If the env uses relay mode and keeps a socks-proxy unit, run st-cli bootstrap messages <env> -c socks-proxy to clear the flag."
  - version: "0.6.0"
    apps: [transfers]
    components: [transfers]
    reason: "transfers 0.5.0 moved its background tasks from celery to dramatiq: the broker is now WORKER_BROKER_URL. The replay writes it from the REDIS_URL secret."
    warnings:
      - "Remove the CELERY_BROKER_URL line from st_transfers_backend_env in transfers/<env>/transfers/vars.yml."
      - "Point the broker at a Redis 7 or later with eviction disabled (maxmemory-policy noeviction)."
  - version: "next"
    apps: [docs]
    components: [docs]
    new_components: [yhub]
    full_replay: true
    reason: "docs 6 replaces the yprovider unit with the yhub unit. Prepare an empty PostgreSQL database and a durable Redis for yhub before you answer. The replay writes the yhub unit, the RSA keys and the new core keys."
    warnings:
      - "With hashi_vault: create JWT_PRIVATE_KEY and YHUB_JWT_PRIVATE_KEY in OpenBao before the deploy."
      - "st-cli generate-keypairs docs <env> mints the two RSA keys."
      - "With hashi_vault: create POSTGRES, REDIS and, for the data migration, LEGACY_S3_SECRET_ACCESS_KEY in OpenBao before the deploy."
      - "Create the yhub database before the deploy."
      - "Give yhub its own durable Redis 6.2+ or Valkey (AOF on, no eviction of keys without expiry), not the Django cache."
      - "Enable bucket versioning on the media bucket before the deploy and keep it on."
      - "Keep every <document-id>/file object in the media bucket."
      - "Give the LEGACY_S3_* credentials the rights s3:ListBucket, s3:GetObject, s3:ListBucketVersions and s3:GetObjectVersion."
      - "Remove the COLLABORATION_SERVER_SECRET and COLLABORATION_API_URL lines from st_docs_backend_env in docs/<env>/docs/vars.yml."
      - "With ansible-vault: remove vault_collaboration_server_secret with st-cli secrets docs <env> -c docs."
      - "Remove the CADDY_YPROVIDER_ENDPOINTS line from st_docs_caddy_env in docs/<env>/docs/vars.yml."
      - "Open port 50601 from the core hosts and the workers hosts to the yhub hosts."
      - "After st-cli deploy docs <env>, run st-cli oneoff docs <env> -- python manage.py migrate_documents. It works only while SOFT_MIGRATION=true: yhub answers 503 when it is off."
      - "Then run st-cli oneoff docs <env> -- python manage.py migrate_documents --retry-failed until no document fails."
      - "After the migration, set SOFT_MIGRATION=false in st_docs_yhub_env, then run st-cli deploy docs <env> -c yhub."
      - "After the migration, remove the LEGACY_S3_* lines from st_docs_yhub_env and, with ansible-vault, vault_legacy_s3_secret_access_key."
      - "After the first successful deploy, delete docs/<env>/yprovider/ and the yprovider unit in .st-cli.yml."

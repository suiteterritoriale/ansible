minor_changes:
  - "calendars: add a ``calendars`` role that deploys the Calendars application (suitenumerique/calendars) as a caddy + frontend + backend + SabreDAV CalDAV server core with a Dramatiq workers sub-app on the rootless podman base. The deploy runs the Django migrations, then the CalDAV schema script ``init-database.sh``. The images default to the upstream ``0.2.0`` release."
  - "cli: add ``calendars`` app support to bootstrap: discrete ``DB_*`` database prompts, a ``st_calendars_caldav_env`` blob built from the same answers, generated ``SALT_KEY`` and ``CALDAV_*_API_KEY`` secrets, ``DRAMATIQ_*`` URLs derived from ``REDIS_URL``, and SMTP prompts on the plain ``EMAIL_*`` keys."
  - "cli: calendars bootstrap asks whether to turn on the Messages integration, then prompts for the Messages URL, the channel id and the API key, and writes them as backend env lines."

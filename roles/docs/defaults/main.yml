---
# Automatically generated by aar-doc
# UID of the `docs` user, used for the podman role.
st_docs_uid: 1106
# GID of the `docs` group, used for the podman role.
st_docs_gid: '{{ st_docs_uid }}'
# Triggers the installation of docs.
st_docs_enabled: false
# Remote path to the base directory for docs app.
st_docs_dir: /opt/docs/docs
# The host published port for the docs frontend.
st_docs_port: '50600'
# Image repository for the docs frontend.
st_docs_frontend_image: docker.io/lasuite/impress-frontend
# Image repository for the docs backend.
st_docs_backend_image: docker.io/lasuite/impress-backend
# Image repository for the docs y-provider conversion service.
st_docs_yprovider_image: docker.io/lasuite/impress-y-provider
# Tag of the docs docker images to deploy.
st_docs_tag: v6.1.0
# Local path to the custom template to use for docs backend env file.
st_docs_backend_env_template: docs/backend_env.j2
# Content of the default backend_env_template, not used if st_docs_backend_env_template is defined.
st_docs_backend_env: ''
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content.
st_docs_backend_secret_files: []
# Whether to run database migrations on docs backend startup.
st_docs_backend_run_migrations: true
# Local path to the custom template to use for docs frontend env file.
st_docs_frontend_env_template: docs/frontend_env.j2
# Content of the default frontend_env_template, not used if st_docs_frontend_env_template is defined.
st_docs_frontend_env: ''
# Local path to the custom template to use for docs caddy env file.
st_docs_caddy_env_template: docs/caddy_env.j2
# Content of the default caddy_env_template, not used if st_docs_caddy_env_template is defined. The Caddyfile requires CADDY_S3_PROTOCOL, CADDY_S3_HOST, CADDY_S3_BUCKET and CADDY_YHUB_ENDPOINTS (a space-separated host:port list of yhub upstreams; any replica serves any document). Optional: CADDY_ADMIN_IP_ALLOWLIST (space-separated CIDR list of client IPs allowed on the Django admin URL, default allows all) and CADDY_TRUSTED_PROXIES (space-separated CIDR list of proxies whose X-Forwarded-For sets the client IP, default private_ranges).
st_docs_caddy_env: ''
# Local path to the custom template to use for docs compose file. A custom template must include the y-provider service.
st_docs_compose_template: docs/compose.yaml.j2
# Image repository for the docs caddy reverse-proxy.
st_docs_caddy_image: docker.io/caddy
# The tag of the caddy docker image to use.
# See https://hub.docker.com/_/caddy/tags.
st_docs_caddy_tag: 2.11.7-alpine
# Image repository for the docspec conversion service.
st_docs_docspec_image: ghcr.io/docspecio/api
# Tag of the docspec docker image to deploy.
st_docs_docspec_tag: 3.0.1
# Whether or not to trigger the rollback tasks if the docs deployment fails.
st_docs_rollback_enabled: false
# Local path to a custom logo file (svg) to mount over the docs frontend logo (/assets/icon-docs.svg). No validation is performed. Empty means use the image default.
st_docs_frontend_logo_src: ''
# Local path to a custom theme customization JSON file to mount over the docs backend default theme. No validation is performed. Empty means use the image default.
st_docs_theme_customization_src: ''
# Triggers the installation of the docs workers.
st_docs_workers_enabled: false
# Remote path to the base directory for docs workers.
st_docs_workers_dir: /opt/docs/workers
# Local path to the custom template to use for docs workers env file.
st_docs_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_docs_workers_env_template is defined.
st_docs_workers_env: '{{ st_docs_backend_env }}'
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content. The default value is the list of the backend.
st_docs_workers_secret_files: '{{ st_docs_backend_secret_files }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_docs_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_docs_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the docs yhub collaboration server.
st_docs_yhub_enabled: false
# Remote path to the base directory for the yhub app.
st_docs_yhub_dir: /opt/docs/yhub
# The host published port for the yhub collaboration server.
st_docs_yhub_port: '50601'
# Image repository for the docs yhub collaboration server.
st_docs_yhub_image: docker.io/lasuite/impress-yhub
# Local path to the custom template to use for yhub env file.
st_docs_yhub_env_template: yhub/env.j2
# Content of the default yhub_env_template, not used if st_docs_yhub_env_template is defined. The keys REDIS and POSTGRES are required. Do not set PORT, because the compose file maps the container port 3002.
st_docs_yhub_env: ''
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content.
st_docs_yhub_secret_files: []
# Local path to the custom template to use for yhub compose file.
st_docs_yhub_compose_template: yhub/compose.yaml.j2
# Whether or not to trigger the rollback tasks if the yhub deployment fails.
st_docs_yhub_rollback_enabled: false
# Whether to create or update the yhub database schema at each deployment.
st_docs_yhub_run_init_db: true
# Local path to the custom template to use for y-provider env file.
st_docs_yprovider_env_template: docs/yprovider_env.j2
# Content of the default yprovider_env_template, not used if st_docs_yprovider_env_template is defined. It is the env file of the y-provider conversion service in the docs unit.
st_docs_yprovider_env: ''
# Whether to remove the legacy yprovider unit of docs v5 from the host at each deployment.
st_docs_yprovider_legacy_cleanup_enabled: true
# Remote path to the base directory of the legacy yprovider unit to remove.
st_docs_yprovider_legacy_dir: /opt/docs/yprovider
# Image repository for the cadvisor container.
st_docs_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_docs_cadvisor_tag: v0.60.6
# Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server.
st_docs_cadvisor_enabled: false
# The host published port of the cadvisor container.
st_docs_cadvisor_port: '127.0.0.1:50699'

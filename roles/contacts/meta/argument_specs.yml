---
argument_specs:
  main:
    short_description: "Installs and configures the Contacts application from La Suite Territoriale on Debian systems."
    options:
      st_contacts_public_host:
        type: "str"
        description: "The public hostname used to access the contacts application."
      st_contacts_uid:
        type: "int"
        description: "UID of the `contacts` user, used for the podman role."
        default: 1111
      st_contacts_gid:
        type: "int"
        description: "GID of the `contacts` group, used for the podman role."
        default: "{{ st_contacts_uid }}"
      st_contacts_registries:
        type: "list"
        elements: "dict"
        description: "Optional private container registries to login the `contacts` user onto."
      st_contacts_frontend_image:
        type: "str"
        description: "Image repository for the contacts frontend."
        default: "ghcr.io/suitenumerique/contacts-frontend"
      st_contacts_backend_image:
        type: "str"
        description: "Image repository for the contacts backend and workers."
        default: "ghcr.io/suitenumerique/contacts-backend"
      st_contacts_tag:
        type: "str"
        description: >-
          Tag of the contacts images to deploy. Contacts has no release yet, so the default is the mutable `main` tag.
          Do not pin `main` by digest: the upstream CI deletes untagged images.
        default: "main"
      st_contacts_enabled:
        type: "bool"
        description: "Triggers the installation of the contacts application."
        default: false
      st_contacts_dir:
        type: "str"
        description: "Remote path to the base directory for contacts app."
        default: "/opt/contacts/contacts"
      st_contacts_port:
        type: "str"
        description: "The host published port for the contacts frontend."
        default: "51100"
      st_contacts_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the contacts deployment fails."
        default: false
      st_contacts_compose_template:
        type: "str"
        description: "Local path to the custom template to use for contacts compose file."
        default: "contacts/compose.yaml.j2"
      st_contacts_frontend_env_template:
        type: "str"
        description: "Local path to the custom template to use for contacts frontend env file."
        default: "contacts/frontend_env.j2"
      st_contacts_frontend_env:
        type: "str"
        description: >-
          Content of the default frontend_env_template, not used if st_contacts_frontend_env_template is defined.
          The frontend is a Caddy server. Set CONTACTS_FRONTEND_BACKEND_SERVER=contacts-backend:8000.
          The other keys are optional: DJANGO_ADMIN_URL, DJANGO_ADMIN_IP_ALLOWLIST, CONTACTS_FRONTEND_TRUSTED_PROXIES,
          CONTACTS_FRONTEND_CSP_SCRIPT_SRC and CONTACTS_FRONTEND_CSP_CONNECT_SRC.
        default: ""
      st_contacts_backend_env_template:
        type: "str"
        description: "Local path to the custom template to use for contacts backend env file."
        default: "contacts/backend_env.j2"
      st_contacts_backend_env:
        type: "str"
        description: "Content of the default backend_env_template, not used if st_contacts_backend_env_template is defined."
        default: ""
      st_contacts_backend_secret_files:
        type: "list"
        elements: "dict"
        description: >-
          Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case)
          and one of the keys "src" (local template) or "content" (inline value).
          The role writes the file "secrets/<env>" in the application directory.
          The role mounts the "secrets" directory read-only at /run/secrets.
          The role sets "<ENV>_FILE" in the compose environment.
          The "<ENV>_FILE" variable has priority over the same variable in the env content.
        default: []
      st_contacts_backend_run_migrations:
        type: "bool"
        description: "Whether to run the database migrations on deploy."
        default: true
      st_contacts_workers_enabled:
        type: "bool"
        description: "Triggers the installation of the contacts workers."
        default: false
      st_contacts_workers_dir:
        type: "str"
        description: "Remote path to the base directory for contacts workers."
        default: "/opt/contacts/workers"
      st_contacts_workers_env_template:
        type: "str"
        description: "Local path to the custom template to use for contacts workers env file."
        default: "workers/env.j2"
      st_contacts_workers_env:
        type: "str"
        description: "Content of the default workers_env_template, not used if st_contacts_workers_env_template is defined."
        default: "{{ st_contacts_backend_env }}"
      st_contacts_workers_secret_files:
        type: "list"
        elements: "dict"
        description: >-
          Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case)
          and one of the keys "src" (local template) or "content" (inline value).
          The role writes the file "secrets/<env>" in the application directory.
          The role mounts the "secrets" directory read-only at /run/secrets.
          The role sets "<ENV>_FILE" in the compose environment.
          The "<ENV>_FILE" variable has priority over the same variable in the env content.
          The default value is the list of the backend.
        default: "{{ st_contacts_backend_secret_files }}"
      st_contacts_workers_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the workers deployment fails."
        default: false
      st_contacts_workers_compose_template:
        type: "str"
        description: "Local path to the custom template to use for workers compose file."
        default: "workers/compose.yaml.j2"
      st_contacts_cadvisor_enabled:
        type: "bool"
        description: "Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool."
        default: false
      st_contacts_cadvisor_image:
        type: "str"
        description: "Image repository for the cadvisor container."
        default: "ghcr.io/google/cadvisor"
      st_contacts_cadvisor_tag:
        type: "str"
        description: "Tag of the cadvisor docker image to deploy."
        # renovate: datasource=docker depName=ghcr.io/google/cadvisor
        default: "v0.60.6"
      st_contacts_cadvisor_port:
        type: "str"
        description: "The host published port of the cadvisor container."
        default: "127.0.0.1:51199"

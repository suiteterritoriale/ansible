---
- name: "Create contacts application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "contacts"
    st_podman_application_name: "contacts"
    st_podman_application_dir: "{{ st_contacts_dir }}"
    st_podman_application_rollback_enabled: "{{ st_contacts_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_contacts_compose_template }}"
    st_podman_application_secret_files: "{{ st_contacts_backend_secret_files }}"
    st_podman_application_secret_files_container_uid: "10000"
    st_podman_application_files:
      - src: "{{ st_contacts_backend_env_template }}"
        dest: "backend_env"
      - src: "{{ st_contacts_frontend_env_template }}"
        dest: "frontend_env"

- name: "Play contacts migrations."
  become: true
  become_user: "contacts"
  become_method: ansible.builtin.sudo
  become_flags: "-i"
  run_once: true
  register: migration_result
  changed_when: "'No migrations to apply.' not in migration_result.stdout"
  when: st_contacts_backend_run_migrations
  retries: 3
  delay: 10
  until: migration_result.rc == 0
  ansible.builtin.shell:
    chdir: "{{ st_contacts_dir }}"
    cmd: |
      set -eu
      podman-compose run --rm --name contacts_backend_migrations backend python manage.py migrate --noinput

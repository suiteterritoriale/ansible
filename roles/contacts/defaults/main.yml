---
# Automatically generated by aar-doc
# UID of the `contacts` user, used for the podman role.
st_contacts_uid: 1111
# GID of the `contacts` group, used for the podman role.
st_contacts_gid: '{{ st_contacts_uid }}'
# Image repository for the contacts frontend.
st_contacts_frontend_image: ghcr.io/suitenumerique/contacts-frontend
# Image repository for the contacts backend and workers.
st_contacts_backend_image: ghcr.io/suitenumerique/contacts-backend
# Tag of the contacts images to deploy. Contacts has no release yet, so the default is the mutable `main` tag. Do not pin `main` by digest: the upstream CI deletes untagged images.
st_contacts_tag: main
# Triggers the installation of the contacts application.
st_contacts_enabled: false
# Remote path to the base directory for contacts app.
st_contacts_dir: /opt/contacts/contacts
# The host published port for the contacts frontend.
st_contacts_port: '51100'
# Whether or not to trigger the rollback tasks if the contacts deployment fails.
st_contacts_rollback_enabled: false
# Local path to the custom template to use for contacts compose file.
st_contacts_compose_template: contacts/compose.yaml.j2
# Local path to the custom template to use for contacts frontend env file.
st_contacts_frontend_env_template: contacts/frontend_env.j2
# Content of the default frontend_env_template, not used if st_contacts_frontend_env_template is defined. The frontend is a Caddy server. Set CONTACTS_FRONTEND_BACKEND_SERVER=contacts-backend:8000. The other keys are optional: DJANGO_ADMIN_URL, DJANGO_ADMIN_IP_ALLOWLIST, CONTACTS_FRONTEND_TRUSTED_PROXIES, CONTACTS_FRONTEND_CSP_SCRIPT_SRC and CONTACTS_FRONTEND_CSP_CONNECT_SRC.
st_contacts_frontend_env: ''
# Local path to the custom template to use for contacts backend env file.
st_contacts_backend_env_template: contacts/backend_env.j2
# Content of the default backend_env_template, not used if st_contacts_backend_env_template is defined.
st_contacts_backend_env: ''
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content.
st_contacts_backend_secret_files: []
# Whether to run the database migrations on deploy.
st_contacts_backend_run_migrations: true
# Triggers the installation of the contacts workers.
st_contacts_workers_enabled: false
# Remote path to the base directory for contacts workers.
st_contacts_workers_dir: /opt/contacts/workers
# Local path to the custom template to use for contacts workers env file.
st_contacts_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_contacts_workers_env_template is defined.
st_contacts_workers_env: '{{ st_contacts_backend_env }}'
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content. The default value is the list of the backend.
st_contacts_workers_secret_files: '{{ st_contacts_backend_secret_files }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_contacts_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_contacts_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool.
st_contacts_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_contacts_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_contacts_cadvisor_tag: v0.60.6
# The host published port of the cadvisor container.
st_contacts_cadvisor_port: '127.0.0.1:51199'
